name: Build APK Bimbel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2.1"

      - name: Extract Blueprint V2 Source
        run: |
          set -e

          ZIP="Project_apk_Bimbel_Smart_Kreatif_Cemerlang_BIODATA_KUITANSI_LONGNAME_FIX_FINAL_2026-09-19.zip"

          echo "SOURCE ZIP:"
          echo "$ZIP"

          test -f "$ZIP"

          mkdir -p project
          unzip -q "$ZIP" -d project

          echo "SOURCE CONTENT:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android Project
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create signing key
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app

          keytool -genkeypair \
            -v \
            -keystore app/release-key.jks \
            -alias bimbel \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bimbel123 \
            -keypass bimbel123 \
            -dname "CN=Bimbel Smart Kreatif Cemerlang"

      - name: Configure release signing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release-key.jks")
                      storePassword = "bimbel123"
                      keyAlias = "bimbel"
                      keyPassword = "bimbel123"
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BimbelSmartKreatifCemerlang-Blueprint-V2-Release-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk"
